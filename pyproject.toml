[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "printing-agent"
version = "0.1.0"
description = "Copilot-powered model discovery, generation, inspection, and printer orchestration"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "aiosqlite>=0.20,<1",
    "cryptography>=44,<47",
    "fastapi>=0.116,<1",
    "github-copilot-sdk>=1.0.9,<2",
    "httpx>=0.28,<1",
    "lib3mf>=2.4,<3",
    "numpy>=2,<3",
    "networkx>=3.4,<4",
    "paho-mqtt==2.1.0",
    "pillow>=11,<13",
    "pydantic>=2.11,<3",
    "pydantic-settings>=2.10,<3",
    "python-multipart>=0.0.20,<1",
    "trimesh>=4.7,<5",
    "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.4,<9",
    "pytest-asyncio>=1,<2",
    "respx>=0.22,<1",
    "ruff>=0.12,<1",
]

[project.scripts]
printing-agent = "printing_agent.cli:main"
printing-agent-api = "printing_agent.api:main"

[tool.hatch.build.targets.wheel]
packages = ["src/printing_agent"]

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
